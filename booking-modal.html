<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Consultation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #173a63;
        --navy-2: #0f2846;
        --teal: #1c7fa0;
        --paper: #ffffff;
        --paper-2: #f6f8f9;
        --muted: #5b6672;
        --line: #e7ebee;
        --font-body: "Work Sans", sans-serif;
        --font-mono: "IBM Plex Mono", monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font-body);
        background: var(--paper);
        padding: 30px;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--teal);
        text-transform: uppercase;
      }
      h2 {
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 22px;
        color: var(--navy-2);
        margin: 10px 0 6px;
      }
      p.lead {
        font-size: 13.5px;
        color: var(--muted);
        margin-bottom: 22px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 14px;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.05em;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .field input,
      .field select,
      .field textarea {
        width: 100%;
        font-family: var(--font-body);
        font-size: 14px;
        color: var(--navy-2);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 10px 12px;
      }
      .field textarea {
        resize: vertical;
        min-height: 70px;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        outline: none;
        border-color: var(--teal);
      }
      button {
        width: 100%;
        background: var(--navy);
        color: #fff;
        border: none;
        border-radius: 3px;
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 14.5px;
        padding: 13px;
        cursor: pointer;
      }
      .note {
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        margin-top: 10px;
      }
      .success {
        display: none;
        text-align: center;
        padding: 20px 0;
      }
      .success.active {
        display: block;
      }
      .success h3 {
        font-size: 18px;
        color: var(--navy-2);
        margin-bottom: 8px;
      }
      .success p {
        font-size: 13.5px;
        color: var(--muted);
      }
      @media (max-width: 480px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="eyebrow">FREE CONSULTATION</div>
    <h2>Book your free 30-min call.</h2>
    <p class="lead">
      Tell us a bit about your situation — we'll confirm a time within 24 hours.
    </p>

    <form id="f">
      <div class="row">
        <div class="field">
          <label>Full name</label><input type="text" name="name" required />
        </div>
        <div class="field">
          <label>Phone / WhatsApp</label
          ><input type="tel" name="phone" required />
        </div>
      </div>
      <div class="field">
        <label>Email</label><input type="email" name="email" required />
      </div>
      <div class="row">
        <div class="field">
          <label>What's this about?</label>
          <select name="service">
            <option>Status &amp; extensions</option>
            <option>Permanent residency</option>
            <option>Family sponsorship</option>
            <option>Work permit</option>
            <option>Study permit</option>
            <option>Refusal review</option>
          </select>
        </div>
        <div class="field">
          <label>Best time to call</label>
          <select name="time">
            <option>Morning (Nepal time)</option>
            <option>Afternoon (Nepal time)</option>
            <option>Evening (Nepal time)</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Anything we should know? (optional)</label
        ><textarea name="note"></textarea>
      </div>
      <button type="submit">Confirm booking request</button>
      <p class="note">
        No charge for this call. You only pay if you decide to move forward.
      </p>
    </form>

    <div class="success" id="s">
      <h3>Request received.</h3>
      <p>A consultant will reach out within 24 hours to confirm your time.</p>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      (function () {

    
        const supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY,
        );

        document
          .getElementById("f")
          .addEventListener("submit", async function (e) {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = "Sending...";

            try {
              const payload = {
                full_name: form.querySelector('[name="name"]').value,
                phone: form.querySelector('[name="phone"]').value,
                email: form.querySelector('[name="email"]').value,
                service: form.querySelector('[name="service"]').value,
                best_time: form.querySelector('[name="time"]').value,
                note: form.querySelector('[name="note"]').value,
              };

              // Call .from() on supabaseClient
              const { error } = await supabaseClient
                .from("consultation_bookings")
                .insert([payload]);

              if (error) throw error;

              form.style.display = "none";
              document.getElementById("s").classList.add("active");
              if (window.parent)
                window.parent.postMessage("booking-submitted", "*");
            } catch (err) {
              console.error("Submission Error:", err);
              btn.disabled = false;
              btn.textContent = "Confirm booking request";
              alert(
                "Error: " + (err.message || "Check console logs for details."),
              );
            }
          });
      })();
    </script>
  </body>
</html>
